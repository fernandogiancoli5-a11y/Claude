# Netlify: public site + waitlist function only (the collaborative app is not hosted here).
# Setup, secrets and verification: docs/DEPLOY_FREE.md. No secret values belong in this file;
# set SUPABASE_URL, SUPABASE_SECRET_KEY, WAITLIST_IP_SALT and PAIRLOOM_CONTACT_EMAIL in the
# Netlify UI (Site configuration → Environment variables).

[build]
  # Netlify installs dependencies from package-lock.json before running this.
  command = "npm run build -w @pairloom/site"
  publish = "apps/site/dist"

[build.environment]
  NODE_VERSION = "22.22.0"
  # The privacy page describes Supabase storage and hashed-IP rate limiting.
  PAIRLOOM_WAITLIST_BACKEND = "supabase"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    # The one inline script (marks JS as available before first paint) is allowed by hash;
    # netlify/test/config.test.ts fails if the script and this hash drift apart.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'sha256-ZnYJX5ypMaaAhxxWhSEjbMkhO2A9yPmbzEQH3LFaITA='; style-src 'self'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
